<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link href="style.css" rel="stylesheet">
    <style>
        #contact-container {
            display: inline;
            justify-content: center;
            align-items: center;
            height: 300px;
        }
        .contact-section {
            background-color: whitesmoke;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            padding: 40px;
            margin: 20px;
        }
        .contact-section form label {
            display: block;
            font-size: 18px;
            margin-bottom: 5px;
        }
        .contact-section form input[type="text"],
        .contact-section form input[type="email"],
        .contact-section form textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .contact-section form textarea {
            height: 150px;
            resize: vertical;
        }
        .contact-section form input[type="submit"] {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            transition: background-color 0.3s ease;
        }
        .contact-section form input[type="submit"]:hover {
            background-color: #0056b3;
        }
        .success-message, .error-message {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
        }
        .success-message { background-color: #d4edda; color: #155724; }
        .error-message { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="Story.html">Story</a></li>
                <li><a href="Memories.html">Memories</a></li>
                <li><a href="Gallery.html">Gallery</a></li>
                <li><a href="Contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Contact Us</h1>
        <p>This Website Is Maintained by the Burke and Moore families.</p>
        <p>For Any Comments or Questions Please Contact Us.</p>

        <div id="contact-container">
            <div class="contact-section">
                <!-- CHANGE the email address below to YOUR email -->
                <form action="https://formsubmit.co/your-email@example.com" method="POST">
                    <input type="hidden" name="_subject" value="Memorial Website Contact Form">
                    <input type="hidden" name="_captcha" value="false">
                    <input type="hidden" name="_next" value="https://YOUR_GITHUB_USERNAME.github.io/YOUR_REPO_NAME/Contact.html?success=true">
                    
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                    
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                    
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="6" required></textarea>
                    
                    <input type="submit" value="Submit">
                </form>
            </div>
        </div>
    </main>
    
    <footer></footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('success') === 'true') {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'success-message';
            msgDiv.innerHTML = 'Thank you for your message! We will respond as soon as possible.';
            document.querySelector('.contact-section').insertBefore(msgDiv, document.querySelector('form'));
        }
    </script>
</body>
</html>
