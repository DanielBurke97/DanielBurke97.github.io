    <style>
        /* Gallery grid styles */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-item {
            overflow: hidden;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            overflow: hidden;
        }

        .modal-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 80%;
            object-fit: contain;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Navigation arrows */
        .prev, .next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 60px;
            font-weight: bold;
            padding: 20px;
            cursor: pointer;
            user-select: none;
            transition: 0.3s;
            z-index: 1001;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .prev {
            left: 20px;
        }

        .next {
            right: 20px;
        }

        .prev:hover, .next:hover {
            background-color: rgba(0, 0, 0, 0.8);
            color: #28666e;
        }

        /* Close button */
        .close {
            position: absolute;
            top: 20px;
            right: 35px;
            color: white;
            font-size: 50px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1001;
            transition: 0.3s;
        }

        .close:hover {
            color: #28666e;
        }

        /* Counter display */
        .counter {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 16px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 8px 16px;
            border-radius: 20px;
            font-family: Arial, sans-serif;
            z-index: 1001;
        }

        /* Keyboard hint */
        .keyboard-hint {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            z-index: 1001;
        }

        h1 {
            text-align: center;
            padding: 20px;
            margin: 0;
        }
    </style>

    <!-- Modal -->
    <div id="myModal" class="modal">
        <span class="close">&times;</span>
        <span class="prev">&#10094;</span>
        <span class="next">&#10095;</span>
        <img class="modal-content" id="modalImg">
        <div class="counter" id="counter"></div>
        <div class="keyboard-hint">← → arrows to navigate | ESC to close</div>
    </div>

    <footer></footer>

    <script>
        // Array to store all image paths
        const images = [];
        
        // Collect all image paths from the gallery
        document.querySelectorAll('.gallery-item img').forEach(img => {
            images.push(img.src);
        });
        
        let currentIndex = 0;
        const modal = document.getElementById('myModal');
        const modalImg = document.getElementById('modalImg');
        const closeBtn = document.querySelector('.close');
        const prevBtn = document.querySelector('.prev');
        const nextBtn = document.querySelector('.next');
        const counter = document.getElementById('counter');

        // Function to open modal with specific image
        function openModal(index) {
            currentIndex = index;
            modal.style.display = 'block';
            modalImg.src = images[currentIndex];
            updateCounter();
            // Prevent body scrolling when modal is open
            document.body.style.overflow = 'hidden';
        }

        // Update counter display
        function updateCounter() {
            counter.textContent = `${currentIndex + 1} of ${images.length}`;
        }

        // Navigate to previous image
        function prevImage() {
            currentIndex--;
            if (currentIndex < 0) {
                currentIndex = images.length - 1; // Loop to last image
            }
            modalImg.src = images[currentIndex];
            updateCounter();
        }

        // Navigate to next image
        function nextImage() {
            currentIndex++;
            if (currentIndex >= images.length) {
                currentIndex = 0; // Loop to first image
            }
            modalImg.src = images[currentIndex];
            updateCounter();
        }

        // Close modal
        function closeModal() {
            modal.style.display = 'none';
            document.body.style.overflow = 'auto'; // Re-enable scrolling
        }

        // Add click event to all gallery images
        document.querySelectorAll('.gallery-item').forEach((item, index) => {
            item.addEventListener('click', () => {
                openModal(index);
            });
        });

        // Button event listeners
        closeBtn.addEventListener('click', closeModal);
        prevBtn.addEventListener('click', prevImage);
        nextBtn.addEventListener('click', nextImage);

        // Keyboard navigation
        document.addEventListener('keydown', (event) => {
            if (modal.style.display === 'block') {
                switch(event.key) {
                    case 'ArrowLeft':
                        prevImage();
                        break;
                    case 'ArrowRight':
                        nextImage();
                        break;
                    case 'Escape':
                        closeModal();
                        break;
                }
            }
        });

        // Close modal when clicking outside the image (on the background)
        modal.addEventListener('click', (event) => {
            if (event.target === modal) {
                closeModal();
            }
        });
    </script>
