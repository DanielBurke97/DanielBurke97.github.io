<!--
  Replace the entire <form> section in your Memories.html with this code.
  Make sure to replace YOUR_FORMSPREE_ID_HERE with your actual form ID!
-->
<form action="https://formspree.io/f/mvznwzzp" method="POST" enctype="multipart/form-data">
    
    <!-- This field is required by Formspree -->
    <input type="hidden" name="form-name" value="Memory">
    
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required>

    <label for="message">Message:</label>
    <textarea id="message" name="message" rows="6" required></textarea>

    <label for="photo">Attach Photo:</label>
    <input type="file" id="photo" name="photo" accept="image/*">

    <input type="submit" value="Submit Memory">
</form>
